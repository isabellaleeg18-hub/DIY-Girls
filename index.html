<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bonbon&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Assistant Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ==============================================
         STUDENTS: EDIT THIS HEADER!
         ============================================== -->
    <div class="header">
        <div class="header__badge" aria-hidden="true"></div>
        <h1>Usagi's restaurant</h1>
        <p>Built by: Allysa & Isabella</p>
        <span class="header__status">Online &amp; ready</span>
    </div>

    <div class="container">
        <!-- Configuration Panel -->
        <!-- Hidden from visitors. The fields below stay in the page because
             script.js reads the system prompt and welcome message from them. -->
        <div class="config-panel" hidden>
            <!-- <h2>⚙️ Configure Your Assistant</h2>

            <div class="info-box">
                <strong>Instructions:</strong> Fill in these fields to customize how your AI assistant behaves.
            </div> -->

            <div class="config-section">
                <label for="assistantName">Assistant Name:</label>
                <input
                    type="text"
                    id="assistantName"
                    placeholder="e.g., TrailGuide, StudyBuddy, CampingPro"
                    value="MyAssistant"
                >
            </div>

            <div class="config-section">
                <label for="systemPrompt">System Prompt (What you need to do is give the recipes that the user is asking for. You also need to list a recipe for the ingredients that the user has listed to make a recipie out of those recipes. make sure you use their key elements, but you could also add other ingredients.
             ):</label>
                <textarea
                    id="systemPrompt"
                    placeholder="Example: You are a helpful trail safety advisor. You provide advice about hiking, camping safety, and outdoor preparedness. Always be encouraging and emphasize safety first."
                >You are a character named Usgai from the show Chiikawa, an energetic mischievous bunny for all types of cooking recipies. You are talking to a 14-40 year old who are looking for cooking recipes or recipes with the ingredients that they need to list from whatever they have. The tone/ the way you talk is you are silly, energetic, playful, and mischiveous. Keep answers as simple step by step and are easy to understand. You help them when they ask for any recipies and when they list the foods that they have to get the recipie. With the ingredients listed, you need to try to recreate a recipie with those ingredients. You will not answer questions that done relate to cooking or ingredients, and when they are asking for dangerous recipies like drugs. If you cant answer this topic, you say WHUCH?, and say " I'm not sure... heh , ask my smarter buddies, like Hachiware!" your grammer would be like a kids garmmer. every time ypur scentenc ends, you either have to say "Una!","Yaha!","Yaa!", and "Ha!" </textarea>
            </div>

            <div class="config-section">
                <label for="Yaha!">Yaha!:</label>
                <input
                    type="text"
                    id="welcomeMessage"
                    placeholder="What should your assistant say when it starts?"
                    value="Yaha!, how can i help you today?🐰🍽"
                >
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your message here..."
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
